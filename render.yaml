# Render.com ayarı (Blueprint). Gizli değerler (sync: false) Render panelinden girilir, repoya yazılmaz.
services:
  - type: web
    name: kiraliktruss
    runtime: node
    plan: free
    buildCommand: npm ci
    # Her açılışta: tablolar + göçler (eski şemalı veritabanında da çalışır), yönetici yalnız yoksa açılır, projeler yalnız tablo boşken yüklenir; sonra sunucu başlar.
    startCommand: npm run seed && npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: SITE_DEMO
        value: "true"
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Yeni teklif e-postası (beşi de doluysa gönderilir; boşsa yalnız log). Değerler Render panelinden girilir.
      - key: SITE_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: BILDIRIM_EPOSTA
        sync: false
